# Importar variables de entorno ocultas
spring.config.import=optional:file:.env.properties

# Configuración para desarrollo local
# Los valores por defecto coinciden con el docker-compose.yml incluido (docker compose up -d)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/meowtfit}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# Origen permitido para CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Frontend URL para links en correos
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Configuración de carga de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# AWS S3 — poner enabled=true y completar credenciales para subir a S3
# Sin credenciales los comprobantes se guardan localmente en uploads/comprobantes/
aws.s3.enabled=${AWS_S3_ENABLED:false}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.session-token=${AWS_SESSION_TOKEN:}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:meowtfit-imagenes}

# Configuración de Correo (SMTP Gmail)
# Por defecto el envío real está apagado (app.mail.enabled=false): los correos se
# registran en la consola del backend en vez de enviarse, así no necesitas una cuenta
# de Gmail para correr el proyecto en local. Pon MAIL_ENABLED=true y completa las
# credenciales para probar el envío real (ver .env.properties.example).
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true